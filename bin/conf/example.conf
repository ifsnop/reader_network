# example configuration reader_network 0.75c
enabled = true

# multicast | broadcast | file
source = "multicast"

# record for 600 seconds, then exit
timed = 180

# if true, the process never exits by itself (only via SIGTERM/SIGINT):
# "timed" stops meaning "record N secs then exit" and instead becomes the
# rotation interval, closing the current output file and opening a new one
# every "timed" seconds. Rotation is aligned to absolute wall-clock time
# (not to when the process started): e.g. timed=14400 (4h) rotates exactly
# at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC (whatever the system
# timezone). Compression + FTP upload of
# each rotated file run in a background child process, so live capture is
# never interrupted. If timed is 0/unset while mode_continuous=true, it
# defaults to 7200 (2h). Requires dest_file_timestamp=true and
# source=multicast/broadcast (not "file"). Use this instead of relaunching
# the binary from cron every "timed" seconds to get uninterrupted 24/7
# recordings without overlap/gap handling.
mode_continuous = false

# if true, on SIGTERM/SIGINT (kill, ctrl-c) the process exits immediately
# with EXIT_FAILURE, without compressing or uploading (FTP) the output file
# being written (it is left on disk as is). Background children already
# processing a previously rotated file in mode_continuous are not affected.
# If false (default) the current file is closed, compressed and uploaded
# before exiting.
abort_fast = false

# show intervals, if not in daemon mode, every 5 seconds
timed_stats_interval = 5

# if true, fork & record in background, closing stdout output.
# if false, run in foreground, outputing verbose and stats.
mode_daemon = false

# check and drop duplicated asterix packets (doesn't impact performance)
mode_scrm = true

# save data in a directory structure like MM/DD/YYMMDD-region-HHMMSS
# where YY = year, MM = month, DD = day, hh = hour, mm = minutes, ss = seconds
dest_file_timestamp = true

# don't use directory structure, only filename (needs dest_file_timestamp = true)
dest_file_nodirectory = false

# recording file will be compressed with bzip2
dest_file_compress = true

# output classification, several possibilities or commented out
# cen | est | bal | can | sur
#dest_file_region = "cen"

# besides recording output, send decoded data in a multicast group to localhost,
# so other applications could use decoded data (like client_xxxx)
dest_localhost = true

# output crcs to screen, mainly to debug purposes (must enable mode_scrm to calculate crcs)
# dest_screen_crc = false

# ensure asterix versions
#asterix_versions = "8cbe827058a86db6d84c4132e8e111e5"
asterix_versions = "485910c1fc16ed59afd8c84c02325d31"

